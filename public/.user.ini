; محدودیت‌های آپلود — روی cPanel/LiteSpeed با PHP به‌صورت FCGI خوانده
; می‌شود (هر ۳۰۰ ثانیه cache می‌شود، پس تغییرش بلافاصله اثر نمی‌کند).
;
; چرا اینجاست: تکنسین برای بستن سفارش باید عکس دستگاه را آپلود کند و
; عکس دوربین موبایل به‌راحتی ۵ تا ۱۲ مگابایت است. اگر upload_max_filesize
; سرور کوچک‌تر باشد، PHP فایل را پیش از رسیدن به لاراول دور می‌اندازد و
; تکنسین پیام «آپلود ناموفق بود» می‌گیرد بدون اینکه بفهمد چرا.
;
; post_max_size باید از upload_max_filesize بزرگ‌تر باشد چون علاوه بر
; فایل، بقیهٔ فیلدهای فرم هم در همان درخواست می‌آیند.
;
; فرمِ «آپلود مدارک» ثبت‌نام تکنسین ۸ فایل را در یک درخواست می‌فرستد و هر
; فایل تا ۲۰ مگابایت مجاز است؛ پس post_max_size باید جمعِ آن‌ها را جا دهد،
; وگرنه PHP کلِ بدنه (فایل‌ها + توکن) را دور می‌ریزد و خطای گنگ می‌دهد.
; upload_max_filesize کمی بالاتر از سقفِ ۲۰ مگابایتِ برنامه است تا فایلِ
; مرزی به لاراول برسد و پیام خطای گویا بگیرد، نه اینکه PHP خاموش رَدش کند.
upload_max_filesize = 25M
post_max_size = 220M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 300
